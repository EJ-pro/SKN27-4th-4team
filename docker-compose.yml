services:
  db:
    image: pgvector/pgvector:pg16
    container_name: routinegraph_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/db/schema_muscles.sql:/docker-entrypoint-initdb.d/02_schema_muscles.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: routinegraph_backend
    command: > 
      sh -c "python db/load_exercises.py &&
            python db/load_muscles.py &&
            python api/services/RAG/pgvectordb.py &&
            python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: routinegraph_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./docs/gifs:/docs/gifs
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
